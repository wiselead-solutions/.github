name: github - Auto-Sync

# Keeps this repo synced with its base and its environments (owner working rule 2026-10-30):
#   - open PR branches behind their base are updated, conflicts are reported on the PR;
#   - push to main syncs to DV; push to release/* syncs to RC and PD only; nothing is hand-pinned.
# All logic lives in the org reusable workflow wiselead-solutions/wiselead-solutions
# .github/workflows/repo-auto-sync.yml (read its header). Per-repo knobs are the three
# workflow file names below; empty means "this repo has no such stage yet".
# Generated by wiselead-solutions scripts/rollout-auto-sync.sh.

"on":
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print what would happen; write nothing.'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-sync:
    name: Auto-Sync
    uses: wiselead-solutions/wiselead-solutions/.github/workflows/repo-auto-sync.yml@main
    with:
      dv-workflow: ''
      rc-workflow: ''
      pd-workflow: ''
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      release-bot-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
