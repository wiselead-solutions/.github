# Standard: Rejist guardian v1. Canonical source: product-scaffold/templates/workflows/pr-guardian.yml.template.
# Read docs/pr-guardian-standard.md before changing the shared merge policy.
name: .github - PR Guardian

on:
  workflow_dispatch:
  # Always run trusted base-branch policy; never check out or execute PR code here.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, assigned, unassigned, review_requested, review_request_removed, labeled, unlabeled]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  guard:
    name: Audit Open PRs
    if: >-
      github.event_name != 'pull_request_target'
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || contains(fromJSON('["guardian:skip","hold","blocked:owner","paused-hold"]'), github.event.label.name)
    concurrency:
      group: pr-guardian-${{ github.repository }}
      cancel-in-progress: false
    runs-on: [self-hosted]
    env:
      GUARDIAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GUARDIAN_REQUIRE_REVIEWER: 'false'
      GUARDIAN_RELEASE_METADATA_EXEMPT: 'false'
      GUARDIAN_AUDIT_HELD: 'false'
      GUARDIAN_STALE_BASE_THRESHOLD: '0'
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The reviewed Rejist runtime helper is embedded; no cross-private-repo access is needed.
      - name: Verify job-local PowerShell
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 0
          script: |
            "use strict";
            const fs = require("node:fs");
            const path = require("node:path");
            const https = require("node:https");
            const crypto = require("node:crypto");
            const { pipeline } = require("node:stream/promises");
            const { spawnSync } = require("node:child_process");

            const VERSION = "7.5.11";
            const ASSETS = Object.freeze({
              arm64: Object.freeze({ name: `powershell-${VERSION}-osx-arm64.tar.gz`, sha256: "93C5D5B71A3937E3DBB68934886D318689F57ECDA466443764A9D7101F196E6F" }),
              x64: Object.freeze({ name: `powershell-${VERSION}-osx-x64.tar.gz`, sha256: "44828C7173CDDB335570A76089F2831B9082997EABAFD599B115AAA944F90E69" })
            });
            const PROBE = "$ErrorActionPreference='Stop'; $dictionary=[System.Collections.Concurrent.ConcurrentDictionary[string,string]]::new(); if($dictionary.Count -ne 0){exit 1}; $PSVersionTable.PSVersion.ToString()";
            const MAX_BYTES = 300 * 1024 * 1024;
            const ALLOWED_HOSTS = new Set(["github.com", "release-assets.githubusercontent.com", "objects.githubusercontent.com"]);

            async function download(url, destination, deadline = Date.now() + 120000, redirects = 0) {
              const parsed = new URL(url);
              if (parsed.protocol !== "https:" || !ALLOWED_HOSTS.has(parsed.hostname) || parsed.username || parsed.password || (parsed.port && parsed.port !== "443") || redirects > 5)
                throw new Error("PowerShell download redirect is not an approved HTTPS release host");
              const remaining = deadline - Date.now();
              if (remaining <= 0) throw new Error("PowerShell download timed out");
              return new Promise((resolve, reject) => {
                let timer;
                const finish = error => { clearTimeout(timer); error ? reject(error) : resolve(); };
                const request = https.get(parsed, { headers: { "User-Agent": "wiselead-ops-pwsh-bootstrap" } }, response => {
                  if ([301, 302, 303, 307, 308].includes(response.statusCode)) {
                    response.resume();
                    if (!response.headers.location) { finish(new Error("PowerShell download redirect has no location")); return; }
                    download(new URL(response.headers.location, parsed).href, destination, deadline, redirects + 1).then(() => finish(), finish);
                    return;
                  }
                  if (response.statusCode !== 200 || Number(response.headers["content-length"] || 0) > MAX_BYTES) {
                    response.resume(); finish(new Error("PowerShell release download failed or exceeds its size limit")); return;
                  }
                  let size = 0;
                  response.on("data", chunk => { size += chunk.length; if (size > MAX_BYTES) response.destroy(new Error("PowerShell release exceeds its size limit")); });
                  pipeline(response, fs.createWriteStream(destination, { flags: "wx", mode: 0o600 })).then(() => finish(), finish);
                });
                timer = setTimeout(() => {
                  const error = new Error("PowerShell download timed out");
                  request.destroy(error);
                  finish(error);
                }, remaining);
                request.on("error", finish);
              });
            }

            const realIO = {
              run: (command, args) => spawnSync(command, args, { encoding: "utf8", timeout: 30000, windowsHide: true, stdio: ["ignore", "pipe", "pipe"] }),
              realpath: filename => fs.realpathSync(filename),
              mkdtemp: prefix => fs.mkdtempSync(prefix),
              chmod: (filename, mode) => fs.chmodSync(filename, mode),
              download,
              sha256: async filename => {
                const hash = crypto.createHash("sha256");
                for await (const chunk of fs.createReadStream(filename)) hash.update(chunk);
                return hash.digest("hex").toUpperCase();
              },
              appendPath: (filename, directory) => fs.appendFileSync(filename, directory + "\n", { encoding: "utf8" })
            };

            function probe(io, command) {
              const result = io.run(command, ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", PROBE]);
              const version = String(result.stdout || "").trim();
              return result.status === 0 && !result.error && /^7\.\d+\.\d+(?:-[A-Za-z0-9.]+)?$/.test(version) ? version : null;
            }

            async function ensurePwsh({ platform = process.platform, arch = process.arch, env = process.env, io = realIO, log = () => {} } = {}) {
              const existing = probe(io, "pwsh");
              if (existing) { log(`PowerShell ${existing} passed the runtime health probe; keeping the existing runtime.`); return { runtime: "existing", version: existing }; }
              if (platform !== "darwin" || !Object.hasOwn(ASSETS, arch)) throw new Error("Unhealthy PowerShell on an unsupported OS or architecture; refusing to bypass CI");
              const runnerTemp = env.RUNNER_TEMP;
              const githubPath = env.GITHUB_PATH;
              for (const [name, value] of [["RUNNER_TEMP", runnerTemp], ["GITHUB_PATH", githubPath]]) {
                if (!value || !path.isAbsolute(value) || /[\r\n]/.test(value) || path.resolve(value) === path.parse(value).root)
                  throw new Error(`${name} must be a nonempty absolute, non-root path`);
              }
              const tempRoot = io.realpath(runnerTemp);
              if (!path.isAbsolute(tempRoot) || /[\r\n]/.test(tempRoot) || path.resolve(tempRoot) === path.parse(tempRoot).root)
                throw new Error("Resolved RUNNER_TEMP must remain an absolute, non-root directory");
              const directory = io.mkdtemp(path.join(tempRoot, "ops-pwsh-"));
              const resolvedDirectory = io.realpath(directory);
              const relative = path.relative(tempRoot, resolvedDirectory);
              if (!relative || relative === ".." || relative.startsWith(".." + path.sep) || path.isAbsolute(relative) || path.dirname(resolvedDirectory) !== tempRoot)
                throw new Error("Job-local PowerShell directory escaped RUNNER_TEMP");
              io.chmod(resolvedDirectory, 0o700);
              const asset = ASSETS[arch];
              const archive = path.join(resolvedDirectory, "powershell.tar.gz");
              await io.download(`https://github.com/PowerShell/PowerShell/releases/download/v${VERSION}/${asset.name}`, archive);
              if (await io.sha256(archive) !== asset.sha256) throw new Error("PowerShell archive checksum mismatch; extraction refused");
              const extraction = io.run("tar", ["-xzf", archive, "-C", resolvedDirectory]);
              if (extraction.status !== 0 || extraction.error) throw new Error("PowerShell archive extraction failed");
              const executable = path.join(resolvedDirectory, "pwsh");
              io.chmod(executable, 0o700);
              if (probe(io, executable) !== VERSION) throw new Error("Job-local PowerShell failed its startup and dictionary health probe");
              io.appendPath(githubPath, resolvedDirectory);
              log(`Checksum-verified job-local PowerShell ${VERSION} passed its health probe.`);
              return { runtime: "job-local", version: VERSION, directory: resolvedDirectory };
            }
            await ensurePwsh({ log: message => core.info(message) });
      - name: Set up documentation gate runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Prepare documentation enforcement
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $documentationValidatorPath = Join-Path $env:RUNNER_TEMP 'documentation-baseline.cjs'
          $documentationValidatorSource = @'
          'use strict';

          // This source is embedded in the trusted guardian workflow. PR files are data only.
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const process = require('node:process');
          const { Buffer } = require('node:buffer');
          const { isAbsolute } = require('node:path');
          const AREAS = ['prd', 'trd', 'app_flow', 'design_brief', 'backend_schema', 'implementation_plan'];
          const MANIFEST = '.github/documentation-baseline.json';
          const POLICY_FILES = new Set([
            MANIFEST, '.github/workflows/pr-guardian.yml', '.github/pull_request_template.md',
            '.github/scripts/documentation-baseline.cjs', '.github/scripts/documentation-baseline.test.cjs',
            'docs/documentation-baseline.md', 'AGENTS.md',
            'templates/workflows/pr-guardian.yml.template', 'templates/AGENTS.md.template',
            'templates/pull_request_template.md', 'templates/documentation-baseline.json.template',
            'templates/documentation-baseline.md.template', 'templates/documentation-baseline.cjs.template',
            'templates/documentation-baseline.test.cjs.template',
          ]);
          const prose = value => typeof value === 'string' && value.trim().length >= 20 &&
            !/\b(TODO|TBD|FIXME|placeholder|replace me)\b/i.test(value) &&
            !(value.includes('<') && value.indexOf('>', value.indexOf('<') + 1) > value.indexOf('<') + 1);
          const docPath = value => typeof value === 'string' &&
            /^(?:[A-Za-z0-9_. -]+\/)*[A-Za-z0-9_. -]+\.md$/.test(value) &&
            !value.split('/').some(part => part === '.' || part === '..');
          const canonical = value => JSON.stringify(value, (key, item) => item && typeof item === 'object' && !Array.isArray(item)
            ? Object.fromEntries(Object.keys(item).sort().map(name => [name, item[name]])) : item);
          const digest = body => crypto.createHash('sha256').update(body || '').digest('hex');

          const REGRESSION_FILES = new Map([
            ['wiselead-solutions/ai-org', 'tools/test_validate.py'],
            ['wiselead-solutions/rejist', '.github/tools/test_deploy_routing.py'],
          ]);

          function documentationOnly(files, repository) {
            // Only documentation paths, not all Markdown: runtime/agents/*.md can be executable policy.
            const safe = path => POLICY_FILES.has(path) || path === REGRESSION_FILES.get(repository) ||
              /^(?:README|readme|PRD|TRD|DECISIONS|SETUP|TESTING|BOOTSTRAP|HANDOVER|MEMORY|PROJECT-DETAILS)\.md$/.test(path) ||
              /^docs\/(?!.*(?:^|\/)\.\.(?:\/|$)).+\.md$/.test(path);
            return files.length > 0 && files.every(file => safe(file.filename) &&
              (!file.previous_filename || safe(file.previous_filename)));
          }

          function withoutDelimited(text, opening, closing) {
            const pieces = [];
            let offset = 0;
            for (;;) {
              const start = text.indexOf(opening, offset);
              if (start < 0) { pieces.push(text.slice(offset)); break; }
              pieces.push(text.slice(offset, start));
              const end = text.indexOf(closing, start + opening.length);
              if (end < 0) break;
              offset = end + closing.length;
            }
            return pieces.join('');
          }

          function impactRows(body, reasons) {
            const rows = new Map();
            const visible = withoutDelimited(withoutDelimited(body || '', '<!--', '-->'), '```', '```');
            for (const line of visible.split('\n')) {
              const cells = line.trim().split('|').map(cell => cell.trim());
              if (cells.length !== 5 || cells[0] || cells[4] || !AREAS.includes(cells[1]) ||
                  !['updated', 'unchanged', 'not_applicable'].includes(cells[2])) continue;
              if (rows.has(cells[1])) reasons.push(`Duplicate documentation impact row: ${cells[1]}.`);
              rows.set(cells[1], { impact: cells[2], evidence: cells[3] });
            }
            return rows;
          }

          function validateReady(area, entry, readDocument, reasons) {
            if (!Array.isArray(entry.documents) || entry.documents.length === 0 ||
                entry.documents.length > 12 || entry.documents.some(path => !docPath(path))) {
              reasons.push(`${area}: ready must reference 1–12 repository-relative Markdown documents.`);
              return false;
            }
            if (!prose(entry.coverage) || !/^[A-Za-z0-9_-]+$/.test(entry.owner || '')) {
              reasons.push(`${area}: ready requires a named responsible role and concrete coverage description.`);
            }
            for (const path of entry.documents) {
              try {
                const text = readDocument(path);
                if (typeof text !== 'string' || withoutDelimited(text, '<!--', '-->').trim().length < 80) {
                  reasons.push(`${area}: ${path} is empty or too short to be a specification.`);
                }
              } catch { reasons.push(`${area}: cannot read ${path} at the PR head.`); }
            }
            return true;
          }

          function validateImpact(area, entry, row, changed, reasons) {
            if (!row || !prose(row.evidence)) {
              reasons.push(`${area}: add one documentation-impact table row with concrete evidence/reason.`); return;
            }
            if (entry.status === 'not_applicable') {
              if (row.impact !== 'not_applicable') reasons.push(`${area}: impact must agree with the manifest's not_applicable status.`);
              return;
            }
            if (row.impact === 'not_applicable') reasons.push(`${area}: documented areas cannot be waived in the PR body.`);
            const referenced = entry.documents.filter(path => row.evidence.includes('`' + path + '`'));
            if (referenced.length === 0) reasons.push(`${area}: evidence must name a canonical document path in backticks.`);
            if (row.impact === 'updated' && !referenced.some(path => changed.has(path))) {
              reasons.push(`${area}: updated must reference a canonical document actually changed in this PR.`);
            }
            if (row.impact === 'unchanged' && entry.documents.some(path => changed.has(path))) {
              reasons.push(`${area}: a canonical document changed; declare updated.`);
            }
          }

          function validateArea(area, entry, context) {
            const { docsOnly, readDocument, rows, changed, reasons } = context;
            if (!entry || !['ready', 'pending', 'not_applicable'].includes(entry.status)) {
              reasons.push(`${area}: invalid status; use ready, pending or not_applicable.`); return;
            }
            if (entry.status === 'pending') {
              if (!/^https:\/\/github\.com\/wiselead-solutions\/[A-Za-z0-9_.-]+\/issues\/[1-9]\d*$/.test(entry.issue || '')) {
                reasons.push(`${area}: pending must link its adoption issue.`);
              }
              if (!docsOnly) reasons.push(`${area}: baseline is pending; complete its adoption issue before implementation.`);
              return;
            }
            if (entry.status === 'not_applicable') {
              if (!prose(entry.reason)) reasons.push(`${area}: non-applicability requires a concrete explanation (20+ characters, no placeholders).`);
            } else if (!validateReady(area, entry, readDocument, reasons)) return;
            if (!docsOnly) validateImpact(area, entry, rows.get(area), changed, reasons);
          }

          function validate({ manifest, files, body, readDocument, repository }) {
            const reasons = [];
            const docsOnly = documentationOnly(files, repository);
            if (!manifest || manifest.version !== 1 || !manifest.areas ||
                Object.keys(manifest.areas).sort().join(',') !== [...AREAS].sort().join(',')) {
              return { ok: false, reasons: ['Missing or invalid .github/documentation-baseline.json (version 1 and exactly six areas required).'] };
            }
            const changed = new Set(files.filter(f => f.status !== 'removed').map(f => f.filename));
            const rows = impactRows(body, reasons);
            const context = { docsOnly, readDocument, rows, changed, reasons };
            for (const area of AREAS) validateArea(area, manifest.areas[area], context);
            return { ok: reasons.length === 0, reasons, documentationOnly: docsOnly };
          }

          function auditState(pr) {
            return {
              head: pr.head?.sha, base: pr.base?.sha, body: digest(pr.body), state: pr.state, draft: Boolean(pr.draft),
              changed_files: pr.changed_files,
              base_ref: pr.base?.ref,
              assignees: JSON.stringify((pr.assignees || []).map(user => user.login).sort()),
              reviewers: JSON.stringify([...(pr.requested_reviewers || []).map(user => user.login), ...(pr.requested_teams || []).map(team => 'team:' + team.slug)].sort()),
              // A JSON list, not a joined string: a label name may itself contain the separator.
              labels: JSON.stringify((pr.labels || []).map(label => String(label.name || '').toLowerCase())
                .filter(name => name !== 'guardian:blocked').sort((a, b) => a.localeCompare(b))),
            };
          }

          function changedFields(before, after) {
            const was = auditState(before), now = auditState(after);
            return Object.keys(was).filter(key => was[key] !== now[key])
              .map(key => `${key} ${JSON.stringify(was[key])} -> ${JSON.stringify(now[key])}`);
          }

          // Changes the comparison ignores, logged so a CI-only difference can be traced to its field.
          function ignoredDifferences(before, after) {
            const notes = [];
            const raw = pr => JSON.stringify(pr.labels || []);
            if (raw(before) !== raw(after)) {
              const keys = pr => [...new Set((pr.labels || []).flatMap(Object.keys))].sort((a, b) => a.localeCompare(b)).join(',');
              const names = pr => (pr.labels || []).map(label => label.name).join(',');
              notes.push(`label JSON differs: names [${names(before)}] -> [${names(after)}], keys [${keys(before)}] -> [${keys(after)}]`);
            }
            return notes;
          }

          function audit(repository, number, expectedHead, api, log = () => {}) {
            if (!/^wiselead-solutions\/[A-Za-z0-9_.-]+$/.test(repository) || !/^[1-9]\d*$/.test(number)) throw Error('Invalid repository or PR number.');
            // A PR whose labels change mid-audit is audited again from scratch once; the verdict always
            // comes from a pass whose PR state was identical before and after it, or the audit throws.
            // Any other change (head, base, body, state, draft, files) throws at once: the workflow checked
            // the body's sections and issue link before this audit, so only a fresh sweep re-runs them.
            for (let attempt = 1; ; attempt++) {
              const { result, before, after } = auditOnce(repository, number, expectedHead, api);
              for (const note of ignoredDifferences(before, after)) log(`PR #${number} attempt ${attempt}: ignored ${note}`);
              const changed = changedFields(before, after);
              if (changed.length === 0) return result;
              log(`PR #${number} attempt ${attempt}: changed during audit: ${changed.join('; ')}`);
              if (attempt >= 2 || changed.some(field => !field.startsWith('labels '))) throw Error(`PR changed during documentation audit (${changed.join('; ')}); re-evaluate before merging.`);
            }
          }

          function auditOnce(repository, number, expectedHead, api) {
            const prefix = `repos/${repository}`;
            const before = api(`${prefix}/pulls/${number}`);
            if (before.state !== 'open' || before.draft || !/^[0-9a-f]{40}$/.test(before.head?.sha || '')) throw Error('PR is closed, draft, or its head is unreadable.');
            if ((before.labels || []).some(label => ['guardian:skip', 'hold', 'blocked:owner', 'paused-hold'].includes(label.name?.toLowerCase()))) throw Error('PR acquired guardian:skip or another explicit hold; do not merge.');
            if (process.env.DOCUMENTATION_EXPECTED_METADATA) {
              const expectedMetadata = JSON.parse(process.env.DOCUMENTATION_EXPECTED_METADATA);
              if (Array.isArray(expectedMetadata.assignees)) expectedMetadata.assignees.sort();
              const observedMetadata = { body: digest(before.body), base: before.base?.ref,
                assignees: (before.assignees || []).map(user => user.login).sort(),
                reviewers: (before.requested_reviewers || []).length + (before.requested_teams || []).length };
              if (canonical(expectedMetadata) !== canonical(observedMetadata)) throw Error('PR metadata changed since the workflow audited its gates.');
            }
            if (expectedHead && expectedHead !== before.head.sha) throw Error('PR head changed since CI was audited.');
            const files = [];
            for (let page = 1; page <= 30; page++) {
              const batch = api(`${prefix}/pulls/${number}/files?per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw Error('Cannot read changed files.');
              files.push(...batch);
              if (batch.length < 100) break;
            }
            if (files.length !== before.changed_files || files.length === 0) throw Error('Changed-file inventory is empty or truncated.');
            const cache = new Map();
            const readAt = (path, ref) => {
              const key = ref + ':' + path;
              if (cache.has(key)) return cache.get(key);
              const encoded = path.split('/').map(encodeURIComponent).join('/');
              const file = api(`${prefix}/contents/${encoded}?ref=${ref}`);
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string') throw Error('Not a readable text file.');
              const text = Buffer.from(file.content, 'base64').toString('utf8');
              cache.set(key, text); return text;
            };
            const readDocument = path => readAt(path, before.head.sha);
            const manifest = JSON.parse(readDocument(MANIFEST));
            // A missing or unreadable base manifest leaves baseManifest null, which fails closed.
            let baseManifest = null;
            if (/^[0-9a-f]{40}$/.test(before.base?.sha || '')) {
              try { baseManifest = JSON.parse(readAt(MANIFEST, before.base.sha)); } catch { baseManifest = null; }
            }
            const result = validate({ manifest, baseManifest, files, body: before.body, readDocument, repository, automation: typeof isAutomationPr === 'function' && isAutomationPr(before, repository) });
            const after = api(`${prefix}/pulls/${number}`);
            return { result: { ...result, head: before.head.sha }, before, after };
          }

          module.exports = { AREAS, validate, audit, documentationOnly };
          if (require.main === module) {
            let repository, number, ghPath, audited = false;
            const executable = name => {
              const value = process.env[name];
              if (!value || !isAbsolute(value)) throw Error(`Trusted workflow must supply absolute ${name}.`);
              return value;
            };
            try {
              const [mode, repo, ...args] = process.argv.slice(2);
              repository = repo;
              ghPath = executable('DOCUMENTATION_GH_PATH');
              const api = endpoint => JSON.parse(execFileSync(ghPath, ['api', endpoint], {
                encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024,
                stdio: ['ignore', 'pipe', 'pipe'],
              }));
              if (!['--merge', '--execute', '--verify'].includes(mode)) throw Error('Expected --merge, --execute or --verify.');
              number = args[0];
              const matchIndex = args.indexOf('--match-head-commit');
              let expected = args[1];
              if (mode === '--merge') expected = matchIndex >= 0 ? args[matchIndex + 1] : '';
              // The guardian keeps these lines out of the block reasons and echoes them to its log.
              const log = line => process.stderr.write(`Documentation audit diagnostic: ${line}\n`);
              const result = audit(repo, number, expected, api, log);
              if (!result.ok) throw Error(result.reasons.join('\n'));
              audited = true;
              if (mode === '--verify') {
                process.stdout.write(JSON.stringify(result));
              } else if (mode === '--merge') {
                // The guardian must make the merge decision now, not arm a future unchecked merge.
                const mergeArgs = args.filter(arg => arg !== '--auto');
                if (matchIndex < 0) mergeArgs.push('--match-head-commit', result.head);
                if (!mergeArgs.includes('--repo')) mergeArgs.push('--repo', repo);
                // ai-org#264: the guardian sets GUARDIAN_MERGE_TOKEN (the release-bot App token) only
                // for a PR that changes .github/workflows/*; only this merge call uses it.
                const mergeToken = process.env.GUARDIAN_MERGE_TOKEN;
                process.stdout.write(execFileSync(ghPath, ['pr', 'merge', ...mergeArgs], {
                  encoding: 'utf8', timeout: 60000, maxBuffer: 8 * 1024 * 1024,
                  stdio: ['ignore', 'pipe', 'pipe'],
                  env: mergeToken ? { ...process.env, GH_TOKEN: mergeToken } : process.env,
                }));
              } else {
                const [command, ...commandArgs] = args.slice(2);
                // Used only for Shakad's existing trusted merge-method fallback script.
                if (command !== 'bash' || commandArgs[0] !== '.github/scripts/guardian-merge.sh') throw Error('Unrecognised guardian merge helper.');
                process.stdout.write(execFileSync(executable('DOCUMENTATION_BASH_PATH'), commandArgs, {
                  encoding: 'utf8', timeout: 60000, maxBuffer: 8 * 1024 * 1024,
                  stdio: ['ignore', 'pipe', 'pipe'],
                }));
              }
            } catch (error) {
              // Best-effort disarm and label; their failures must never turn the gate green. Only a
              // failed audit is labelled here: a refused merge command after a passing audit (conflict,
              // workflow permission, policy) is the guardian workflow's to classify and record.
              if (ghPath && /^wiselead-solutions\/[A-Za-z0-9_.-]+$/.test(repository || '') && /^[1-9]\d*$/.test(number || '')) {
                for (const args of [
                  ['pr', 'merge', number, '--repo', repository, '--disable-auto'],
                  ...(audited ? [] : [['api', '--method', 'POST', `repos/${repository}/issues/${number}/labels`, '-f', 'labels[]=guardian:blocked']]),
                ]) {
                  try { execFileSync(ghPath, args, {timeout:30000,stdio:['ignore','ignore','ignore']}); } catch {}
                }
              }
              // A failing helper reports on stdout as well as stderr; keep both for the caller's matching.
              const detail = [error.stdout, error.stderr].filter(Boolean).map(String).join('\n').trim() || error.message;
              process.stderr.write((audited ? 'Guardian merge refused:\n' : 'Documentation baseline audit rejected:\n') + detail.slice(0, 4000) + '\n');
              process.exitCode = 1;
            }
          }
          '@
          [System.IO.File]::WriteAllText($documentationValidatorPath, $documentationValidatorSource + "`n", [System.Text.UTF8Encoding]::new($false))
          "DOCUMENTATION_VALIDATOR_PATH=$documentationValidatorPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $documentationGh = Get-Command gh -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "DOCUMENTATION_GH_PATH=$($documentationGh.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Mint release-bot token (workflow-touching merges)
        id: release-bot
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify shared guardian policy
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          node --test --test-name-pattern='guardian shared|guardian wrapper' .github/scripts/documentation-baseline.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Shared Guardian policy verification failed' }

      - name: Audit all PRs
        id: audit
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDIAN_WORKFLOW_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          # guardian-standard:audit:start
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $merged = $false
          $appMerged = $false
          $tokenMerged = $false

          $PRS_JSON = gh pr list --state open --limit 1000 --json 'number,title,body,isDraft,assignees,reviewRequests,labels,headRefName,baseRefName,headRefOid,author,autoMergeRequest'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh pr list failed (exit $LASTEXITCODE) -- failing the audit rather than treating it as zero open PRs."
            exit 1
          }
          $ghFailures = @()

          function Invoke-Gh {
            param(
              [Parameter(Mandatory)][string[]] $GhArgs,
              [Parameter(Mandatory)][string]   $What,
              [Parameter(Mandatory)][int]      $Number,
              [string] $BenignIfMatches
            )
            $out = & gh @GhArgs 2>&1
            if ($LASTEXITCODE -ne 0) {
              $outText = $out | Out-String
              if ($BenignIfMatches -and $outText -match $BenignIfMatches) {
                Write-Host "PR #${Number}: $What was already satisfied (gh exited $LASTEXITCODE) - treating as done"
                return $true
              }
              $script:ghFailures += "PR #${Number}: could not $What (gh exited $LASTEXITCODE)"
              Write-Host "::error title=Guardian action failed::PR #${Number} - could not $What (gh exited $LASTEXITCODE)"
              if ($out) { Write-Host $outText }
              return $false
            }
            return $true
          }

          function Test-GuardianVerdictChanged([int]$PrNumber, [string]$Verdict) {
            $prior = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/pulls/$PrNumber/reviews?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("PR Guardian")) | .body | @base64')
            if ($LASTEXITCODE -ne 0) {
              $script:ghFailures += "PR #${PrNumber}: could not read prior Guardian reviews"
              return $true
            }
            if ($prior.Count -eq 0) { return $true }
            return $prior[-1] -cne [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Verdict))
          }

          function Set-GuardianBlocked([int]$PrNumber, [string]$Reasons) {
            $comment = "❌ **PR Guardian — Blocked**`n`nThis PR cannot merge until the following are resolved:`n$Reasons`n`nPush a fix and the guardian will re-evaluate automatically."
            if (Test-GuardianVerdictChanged $PrNumber $comment) { [void](Invoke-Gh @('pr', 'review', "$PrNumber", '--request-changes', '--body', $comment) 'post the blocked verdict' $PrNumber) } else { Write-Host "PR #$PrNumber verdict unchanged - not re-posting" }
            [void](Invoke-Gh @('api', '--method', 'POST', "repos/$env:GITHUB_REPOSITORY/issues/$PrNumber/labels",
                               '-f', 'labels[]=guardian:blocked') 'apply guardian:blocked' $PrNumber)
          }

          try {
            $PRS = @($PRS_JSON | ConvertFrom-Json)
          } catch {
            Write-Host "::error::gh pr list returned unparseable JSON -- failing the audit rather than treating it as zero open PRs."
            exit 1
          }

          if ($PRS.Count -ge 1000) { throw 'PR inventory reached its safety limit; refusing a partial sweep.' }

          $ciExpected = $true
          try {
            $workflowFiles = @(Get-ChildItem -LiteralPath '.github/workflows' -File -ErrorAction Stop | Where-Object { $_.Extension -in '.yml', '.yaml' -and $_.Name -ne 'pr-guardian.yml' })
            $ciExpected = @($workflowFiles | Where-Object {
              $source = Get-Content -LiteralPath $_.FullName -Raw -ErrorAction Stop
              $source -match '(?m)^\s{2}["'']?pull_request(?:_target)?["'']?:' -or $source -match '(?m)^on:\s*(?:\[|\{)?\s*["'']?pull_request(?:_target)?\b'
            }).Count -gt 0
          } catch { $ciExpected = $true }
          $reviewerGateApplies = $false
          if ($env:GUARDIAN_REQUIRE_REVIEWER -eq 'true') {
            $collaborators = gh api "repos/$env:GITHUB_REPOSITORY/collaborators?per_page=100" --jq 'length'
            $reviewerGateApplies = $LASTEXITCODE -ne 0 -or "$collaborators" -notmatch '^\d+$' -or [int]$collaborators -gt 1
          }

          foreach ($pr in $PRS) {
            $NUM = $pr.number
            $failuresBefore = $ghFailures.Count
            $env:DOCUMENTATION_EXPECTED_METADATA = @{
              body = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes([string]$pr.body))).ToLowerInvariant()
              base = [string]$pr.baseRefName
              assignees = @($pr.assignees.login | Sort-Object)
              reviewers = @($pr.reviewRequests).Count
            } | ConvertTo-Json -Compress -Depth 10
            $BODY = if ($null -ne $pr.body) { [string]$pr.body } else { '' }
            foreach ($pass in 1..2) {
              $BODY = $BODY -replace '&amp;', '&' -replace '&lt;', '<' -replace '&gt;', '>' -replace '&#39;', "'" -replace '&quot;', '"' -replace '&#34;', '"'
            }
            $DRAFT = [bool]$pr.isDraft
            $ASSIGNEES = @($pr.assignees).Count
            $LABELS = (@($pr.labels) | ForEach-Object { $_.name }) -join ','
            $HEAD_REF = [string]$pr.headRefName
            $BASE_REF = [string]$pr.baseRefName
            $HEAD_SHA = [string]$pr.headRefOid

            Write-Host "--- PR #$NUM ---"

            $labelNames = @($pr.labels | ForEach-Object { "$($_.name)" })
            $held = @($labelNames | Where-Object { $_ -iin @('guardian:skip', 'hold', 'blocked:owner', 'paused-hold') }).Count -gt 0
            if ($null -ne $pr.autoMergeRequest) {
              if (-not (Invoke-Gh @('pr', 'merge', "$NUM", '--disable-auto') 'disable legacy auto-merge' $NUM)) { continue }
            }
            if ($held -and $env:GUARDIAN_AUDIT_HELD -ne 'true') {
              Write-Host "PR #$NUM skipped (explicit hold)"
              continue
            }

            $IS_DEPENDABOT = $HEAD_REF -like 'dependabot/*' -and $pr.author.login -in @('app/dependabot', 'dependabot[bot]')
            $metadataExempt = $IS_DEPENDABOT -or ($env:GUARDIAN_RELEASE_METADATA_EXEMPT -eq 'true' -and ($HEAD_REF -eq 'develop' -or $HEAD_REF -like 'backmerge/*'))

            $BLOCK_REASON = ''

            if ($DRAFT) { $BLOCK_REASON += "`n- PR is still a draft" }

            if (-not $metadataExempt) {
              if ($ASSIGNEES -eq 0) { $BLOCK_REASON += "`n- No assignee set" }

              if ($reviewerGateApplies -and @($pr.reviewRequests).Count -eq 0) { $BLOCK_REASON += "`n- No reviewer requested" }

              foreach ($section in 'Executive Summary', 'Technical Summary', 'Testing', 'Risk & Rollout', 'Reviewer Guidance') {
                if ($BODY -notmatch [regex]::Escape($section)) {
                  $BLOCK_REASON += "`n- Missing PR section: $section"
                }
              }

              if ($BODY -notmatch '(Closes|Fixes|Resolves|Part[ -]of) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|#)[0-9]') {
                $BLOCK_REASON += "`n- Missing issue link (Closes #, Fixes #, Resolves #, or Part of #)"
              }
            }

            # ci-gate:start
            $SELF_RUNS = @()
            $SELF_RUNS_JSON = gh api "repos/$($env:GITHUB_REPOSITORY)/actions/workflows/pr-guardian.yml/runs?head_sha=$HEAD_SHA&per_page=100" --jq '[.workflow_runs[].id | tostring]'
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($SELF_RUNS_JSON)) {
              try { $SELF_RUNS = @($SELF_RUNS_JSON | ConvertFrom-Json) } catch { $SELF_RUNS = @() }
            }
            $SELF_RUNS = @($SELF_RUNS + [string]$env:GITHUB_RUN_ID | Select-Object -Unique)

            $CI_RAW = gh pr view $NUM --json 'statusCheckRollup,headRefOid'
            $auditedHead = ''
            if ($LASTEXITCODE -eq 0 -and $CI_RAW) { try { $auditedHead = "$(($CI_RAW | ConvertFrom-Json).headRefOid)" } catch { $auditedHead = '' } }
            $CI_CHECKS = @()
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($CI_RAW)) {
              try {
                $rollup = @(($CI_RAW | ConvertFrom-Json).statusCheckRollup)
                $CI_CHECKS = @(
                  $rollup
                    | Where-Object { $_ }
                    | Group-Object { if ($_.name) { "$($_.workflowName)/$($_.name)" } else { $_.context } }
                    | ForEach-Object {
                        $latest = $_.Group | Sort-Object { if (-not $_.startedAt -and ($_.status -in @('QUEUED','IN_PROGRESS','WAITING','PENDING') -or $_.state -eq 'PENDING')) { [datetime]::MaxValue } else { [datetime]($_.startedAt ?? '1970-01-01T00:00:00Z') } } | Select-Object -Last 1
                        $state = if ($latest.conclusion) { $latest.conclusion } else { $latest.state }
                        $bucket =
                          if (-not $latest.conclusion -and $latest.status -and $latest.status -ne 'COMPLETED') { 'pending' }
                          else {
                            switch ($state) {
                              'SUCCESS'     { 'pass' }
                              'NEUTRAL'     { 'pass' }
                              'SKIPPED'     { 'skipping' }
                              'CANCELLED'   { 'cancel' }
                              'PENDING'     { 'pending' }
                              'QUEUED'      { 'pending' }
                              'IN_PROGRESS' { 'pending' }
                              'EXPECTED'    { 'pending' }
                              default       { 'fail' }
                            }
                          }
                        [pscustomobject]@{
                          name   = $_.Name
                          bucket = $bucket
                          link   = if ($latest.detailsUrl) { [string]$latest.detailsUrl } else { '' }
                        }
                      }
                )
              } catch { $CI_CHECKS = @() }
            }

            $CI_OTHER = @($CI_CHECKS | Where-Object {
              $link = if ($null -ne $_.link) { [string]$_.link } else { '' }
              $m = [regex]::Match($link, '/actions/runs/(?<id>[0-9]+)/')
              $rid = if ($m.Success) { $m.Groups['id'].Value } else { '' }
              $SELF_RUNS -notcontains $rid
            })

            if (@($CI_OTHER | Where-Object { $_.bucket -eq 'fail' -or $_.bucket -eq 'cancel' }).Count -gt 0) {
              $BLOCK_REASON += "`n- CI checks are failing"
            }
            if (($ciExpected -and $CI_OTHER.Count -eq 0) -or @($CI_OTHER | Where-Object { $_.bucket -eq 'pending' }).Count -gt 0) {
              $BLOCK_REASON += "`n- CI checks have not finished yet"
            }
            if (-not $auditedHead -or $auditedHead -cne $HEAD_SHA) { $BLOCK_REASON += "`n- CI head is unreadable or changed during audit" }
            # ci-gate:end

            $MERGEABLE = 'UNKNOWN'
            $MERGE_INFO = gh pr view $NUM --json mergeable
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($MERGE_INFO)) {
              try { $m = ($MERGE_INFO | ConvertFrom-Json).mergeable; if ($m) { $MERGEABLE = [string]$m } } catch { }
            } else {
              Write-Host "PR #${NUM}: could not read mergeable state, auditing without it"
            }
            Write-Host "PR #$NUM mergeable = $MERGEABLE (base $BASE_REF)"
            $CONFLICT_REASON = "`n- Branch conflicts with $BASE_REF and cannot be merged (rebase onto $BASE_REF, or merge it in, and push)"
            if ($MERGEABLE -eq 'CONFLICTING') { $BLOCK_REASON += $CONFLICT_REASON }

            if (-not $BLOCK_REASON -and -not $held) {
              $docPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try {
                $docOut = @(& node $env:DOCUMENTATION_VALIDATOR_PATH --verify $env:GITHUB_REPOSITORY "$NUM" "$auditedHead" 2>&1 | ForEach-Object { "$_" })
                $docCode = $LASTEXITCODE
              } finally { $ErrorActionPreference = $docPreference }
              $global:LASTEXITCODE = 0
              $docOut | Where-Object { "$_" -match '^Documentation audit diagnostic:' } | ForEach-Object { Write-Host "$_" }
              if ($docCode -ne 0) {
                $docReasons = @($docOut | ForEach-Object { "$_".Trim() } | Where-Object { $_ -and $_ -notmatch '^Documentation baseline / merge blocked:' -and $_ -notmatch '^Documentation audit diagnostic:' -and $_ -notmatch '^\{' })
                if ($docReasons.Count -eq 0) { $docReasons = @('the validator failed without a reason; the next run re-audits it') }
                Write-Host "PR #$NUM documentation baseline blocked: $($docReasons -join ' | ')"
                foreach ($docReason in $docReasons) { $BLOCK_REASON += "`n- Documentation baseline: $docReason" }
              }
            }

            if (-not $BLOCK_REASON -and -not $held -and $env:GUARDIAN_STALE_BASE_THRESHOLD -match '^[1-9]\d*$') {
              $behind = gh api "repos/$env:GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_SHA" --jq '.behind_by // empty'
              if ($LASTEXITCODE -ne 0 -or "$behind" -notmatch '^\d+$') { $BLOCK_REASON += "`n- Could not verify merge base freshness" }
              elseif ([int]$behind -gt [int]$env:GUARDIAN_STALE_BASE_THRESHOLD) { $BLOCK_REASON += "`n- Branch is $behind commits behind $BASE_REF; update the branch and re-run CI" }
            }

            if ($BLOCK_REASON) {
              Write-Host "PR #$NUM BLOCKED"
              Set-GuardianBlocked $NUM $BLOCK_REASON
            } else {
              Write-Host "PR #$NUM PASSED"
              $COMMENT = if ($held) { '✅ **PR Guardian** — metadata and CI pass; merge withheld by explicit hold. Documentation is re-audited after the hold is removed.' }
                elseif ($merged) { '✅ **PR Guardian** — every gate this repo requires is now satisfied; merge deferred to the next sweep.' }
                else { '✅ **PR Guardian** — every gate this repo requires is now satisfied; ready, and merging.' }
              if (Test-GuardianVerdictChanged $NUM $COMMENT) { [void](Invoke-Gh @('pr', 'review', "$NUM", '--comment', '--body', $COMMENT) 'post the pass verdict' $NUM) } else { Write-Host "PR #$NUM verdict unchanged - not re-posting" }

              $reviewIdsErrFile = New-TemporaryFile
              $REVIEW_IDS_RAW = (gh api --paginate "repos/$env:GITHUB_REPOSITORY/pulls/$NUM/reviews?per_page=100" --jq '.[] | select(.user.login=="github-actions[bot]" and .state=="CHANGES_REQUESTED" and (.body // "" | contains("PR Guardian"))) | .id' 2>$reviewIdsErrFile | Out-String)
              $reviewIdsExit = $LASTEXITCODE
              if ($reviewIdsExit -ne 0) {
                $reviewIdsErr = (Get-Content -Path $reviewIdsErrFile -Raw -ErrorAction SilentlyContinue)
                Write-Host "PR #$NUM -- could not read reviews to dismiss: $($reviewIdsErr)"
                $ghFailures += "PR #${NUM}: could not list reviews to dismiss (gh exited $reviewIdsExit)"
                Remove-Item -Path $reviewIdsErrFile -ErrorAction SilentlyContinue
              } else {
                Remove-Item -Path $reviewIdsErrFile -ErrorAction SilentlyContinue
                $REVIEW_IDS = @($REVIEW_IDS_RAW -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                foreach ($ID in $REVIEW_IDS) {
                  $DISMISS_OUT = (gh api --method PUT "repos/$env:GITHUB_REPOSITORY/pulls/$NUM/reviews/$ID/dismissals" -f message='Superseded: PR Guardian re-audited this PR and it now passes.' -f event=DISMISS 2>&1 | Out-String)
                  if ($LASTEXITCODE -ne 0) {
                    if ($DISMISS_OUT -match 'Can not dismiss a dismissed pull request review') {
                      Write-Host "PR #$NUM -- stale review $ID was already dismissed"
                    } else {
                      $ghFailures += "PR #${NUM}: could not dismiss stale review $ID (gh exited $LASTEXITCODE)"
                    }
                    Write-Host "PR #$NUM -- failed to dismiss stale review $ID`: $($DISMISS_OUT.Trim())"
                  } else {
                    Write-Host "PR #$NUM -- dismissed stale guardian review $ID"
                  }
                }
              }

              if ($held) {
                [void](Invoke-Gh @('api', '--method', 'DELETE', "repos/$env:GITHUB_REPOSITORY/issues/$NUM/labels/guardian%3Ablocked") 'clear obsolete guardian:blocked on held PR' $NUM -BenignIfMatches 'Label does not exist|Not Found|HTTP 404')
                Write-Host "PR #$NUM HELD - metadata and CI pass; merge withheld by explicit hold"
                continue
              }
              if ($ghFailures.Count -gt $failuresBefore) { Write-Host "PR #$NUM not merged: verdict actions failed"; continue }
              if ($merged) {
                Write-Host "PR #$NUM PASSED but already merged one PR this sweep -- leaving it for the next sweep (#2140)."
              } else {
                $mergeMethod = if ($BASE_REF -eq $env:GUARDIAN_DEFAULT_BRANCH -and "$($pr.headRefName)" -cmatch '^(release|hotfix|backmerge)/') { '--merge' } else { '--squash' }
                $ALLOWED = @('merge', 'squash', 'rebase')
                $ALLOWED_RAW = gh api "repos/$env:GITHUB_REPOSITORY/rules/branches/$BASE_REF" --jq '[.[] | select(.type=="pull_request") | .parameters.allowed_merge_methods // ["merge","squash","rebase"]] | if length==0 then ["merge","squash","rebase"] else reduce .[1:][] as $a (.[0]; [.[] as $x | select(any($a[]; . == $x)) | $x]) end | join(",")'
                if ($LASTEXITCODE -eq 0 -and "$ALLOWED_RAW".Trim()) {
                  $ALLOWED = "$ALLOWED_RAW".Trim() -split ','
                  if ($ALLOWED -notcontains $mergeMethod.TrimStart('-')) {
                    $fallback = @('squash', 'rebase', 'merge') | Where-Object { $ALLOWED -contains $_ } | Select-Object -First 1
                    if ($fallback) {
                      Write-Host "PR #$NUM -- $BASE_REF rules allow [$($ALLOWED -join ',')], not $mergeMethod; using --$fallback"
                      $mergeMethod = "--$fallback"
                    }
                  }
                } else {
                  Write-Host "PR #$NUM -- could not read $BASE_REF merge rules; keeping $mergeMethod"
                }
                $repoMethods = gh api "repos/$env:GITHUB_REPOSITORY" --jq '[if .allow_squash_merge then "squash" else empty end, if .allow_rebase_merge then "rebase" else empty end, if .allow_merge_commit then "merge" else empty end] | join(",")'
                if ($LASTEXITCODE -eq 0 -and "$repoMethods" -match '^(merge|squash|rebase)(,(merge|squash|rebase))*$') {
                  $effectiveMethods = @($ALLOWED | Where-Object { ("$repoMethods" -split ',') -contains $_ })
                  if ($effectiveMethods -notcontains $mergeMethod.TrimStart('-')) {
                    $fallback = @('squash', 'rebase', 'merge') | Where-Object { $effectiveMethods -contains $_ } | Select-Object -First 1
                    if (-not $fallback) { Set-GuardianBlocked $NUM "`n- Repository settings and branch rules allow no common merge method"; continue }
                    $mergeMethod = "--$fallback"
                  }
                }
                $deleteArgs = @(if ($HEAD_REF -cne $env:GUARDIAN_DEFAULT_BRANCH -and $HEAD_REF -notmatch '^(develop|main)$|^(release|hotfix)/') { '--delete-branch' })
                $nowJson = gh pr view $NUM --json 'headRefOid,isDraft,state,labels,body,assignees,reviewRequests,baseRefName'
                $nowOk = ($LASTEXITCODE -eq 0)
                $global:LASTEXITCODE = 0
                $now = $null
                if ($nowOk -and $nowJson) { try { $now = $nowJson | ConvertFrom-Json } catch { $now = $null } }
                if (-not $auditedHead -or -not $now) {
                  Write-Host "PR #$NUM not merged: could not read its audited head or re-read it before merging; the next run re-audits it"
                  continue
                }
                $nowSkip = @($now.labels | Where-Object { $_.name -iin @('guardian:skip', 'hold', 'blocked:owner', 'paused-hold') }).Count -gt 0
                $metadataChanged = $now.body -cne $pr.body -or $now.baseRefName -cne $BASE_REF -or
                  (@($now.assignees.login | Sort-Object) -join ',') -cne (@($pr.assignees.login | Sort-Object) -join ',') -or
                  (@($now.reviewRequests | ConvertTo-Json -Compress -Depth 10) -join '') -cne (@($pr.reviewRequests | ConvertTo-Json -Compress -Depth 10) -join '')
                if ($metadataChanged -or $now.state -cne 'OPEN' -or $now.isDraft -or "$($now.headRefOid)" -cne $auditedHead -or $nowSkip) {
                  Write-Host "PR #$NUM not merged: it changed during this audit (head $auditedHead -> $($now.headRefOid), state $($now.state), draft $($now.isDraft), guardian:skip $nowSkip); the next run re-audits it"
                  continue
                }
                $useBotToken = $false
                if ($env:GUARDIAN_WORKFLOW_TOKEN) {
                  $filesJson = (gh pr view $NUM --json files | Out-String)
                  $prFiles = @()
                  try { $prFiles = @(($filesJson | ConvertFrom-Json).files | ForEach-Object { "$($_.path)" }) } catch { $prFiles = @() }
                  if (@($prFiles | Where-Object { $_ -like '.github/workflows/*' }).Count -gt 0) { $useBotToken = $true }
                }
                if ($useBotToken) {
                  Write-Host "PR #$NUM changes .github/workflows/ -- merging under the release-bot App token (ai-org#264)"
                  $env:GUARDIAN_MERGE_TOKEN = $env:GUARDIAN_WORKFLOW_TOKEN
                } else {
                  Remove-Item Env:GUARDIAN_MERGE_TOKEN -ErrorAction SilentlyContinue
                }
                $MERGE_OUT = (node $env:DOCUMENTATION_VALIDATOR_PATH --merge $env:GITHUB_REPOSITORY $NUM $mergeMethod @deleteArgs --match-head-commit $auditedHead 2>&1 | Out-String).Trim()
                if ($LASTEXITCODE -eq 0) {
                  $merged = $true
                  "merged_base=$BASE_REF" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
                  "merged_pr=$NUM" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
                  if ($useBotToken) { $appMerged = $true } else { $tokenMerged = $true }
                  $MERGE_OUT -split "`n" | Where-Object { $_ -match '^Documentation audit diagnostic:' } | ForEach-Object { Write-Host $_ }
                  [void](Invoke-Gh @('api', '--method', 'DELETE', "repos/$env:GITHUB_REPOSITORY/issues/$NUM/labels/guardian%3Ablocked") 'clear guardian:blocked' $NUM -BenignIfMatches 'Label does not exist|Not Found|HTTP 404')
                } else {
                  Write-Host "PR #$NUM MERGE REFUSED (exit $LASTEXITCODE): $MERGE_OUT"
                  if ($MERGE_OUT -notmatch 'base branch policy' -and $MERGE_OUT -match 'not mergeable|merge commit cannot be cleanly created|[Mm]erge conflict') {
                    Write-Host "PR #$NUM conflicts with $BASE_REF -- recording it on the PR"
                    Set-GuardianBlocked $NUM $CONFLICT_REASON
                  } elseif ($MERGE_OUT -match 'Head branch was modified') {
                    Write-Host "PR #$NUM not merged: its head moved after the audit read it; the next sweep re-audits it"
                  } elseif ($MERGE_OUT -match 'Documentation baseline audit rejected') {
                  Set-GuardianBlocked $NUM "`n- Merge-time documentation audit refused the PR; see the audit log and re-evaluate its evidence"
                } elseif ($useBotToken) {
                    $guardianToken = $env:GH_TOKEN
                    $env:GH_TOKEN = $env:GUARDIAN_WORKFLOW_TOKEN
                    $UPDATE_OUT = (gh pr update-branch $NUM 2>&1 | Out-String).Trim()
                    $updateExit = $LASTEXITCODE
                    $env:GH_TOKEN = $guardianToken
                    if ($updateExit -eq 0) {
                      Write-Host "PR #$NUM branch updated from $BASE_REF under the release-bot App token; CI re-runs and a later sweep merges it"
                    } else {
                      Write-Host "PR #$NUM update-branch under the release-bot App token failed: $UPDATE_OUT"
                      [void](Invoke-Gh @('api', '--method', 'POST', "repos/$env:GITHUB_REPOSITORY/issues/$NUM/labels", '-f', 'labels[]=guardian:blocked') 'apply guardian:blocked' $NUM)
                    }
                  } else {
                    [void](Invoke-Gh @('api', '--method', 'POST', "repos/$env:GITHUB_REPOSITORY/issues/$NUM/labels", '-f', 'labels[]=guardian:blocked') 'apply guardian:blocked' $NUM)
                  }
                }
              }
            }
          }

          if ($appMerged -and -not $tokenMerged) {
            "app_merged_only=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          if ($merged) {
            "merged=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            Write-Host "Guardian merged at least one PR."
          } else {
            "merged=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            Write-Host "No PR merged this run, nothing to deploy."
          }
          if ($ghFailures.Count -gt 0) {
            Write-Host ''
            foreach ($f in $ghFailures) { Write-Host $f }
            "gh_failures=$($ghFailures.Count)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          }
          exit 0
          # guardian-standard:audit:end

      - name: Fail if a verdict could not be recorded
        if: ${{ !cancelled() && steps.audit.outputs.gh_failures != '' }}
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          GH_FAILURES: ${{ steps.audit.outputs.gh_failures }}
        run: |
          throw "Guardian could not record its verdict on $env:GH_FAILURES action(s). A guardian that cannot post what it decided must not report success."
