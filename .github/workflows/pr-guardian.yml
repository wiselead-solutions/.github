name: .github — PR Guardian

# Hygiene gate for this repository, added because it had no PR gate of any
# kind - no workflows directory at all. Modelled on the fixed, current
# generation of this org's guardians (dev-hub, wiselead-marketing, tasker):
# read CI state from statusCheckRollup rather than `gh pr checks` text
# output (the runner's gh 2.46 has no --json support on that subcommand, and
# text-parsing an empty/failed API response is indistinguishable from "no
# checks" - which several guardians in this org have merged straight
# through), post COMMENT reviews rather than approve/request-changes (the
# default GITHUB_TOKEN cannot later approve to clear its own
# CHANGES_REQUESTED), and merge directly with no `--auto` (auto-merge waits
# on required status checks, and this repo configures none).
#
# ZERO CHECKS passes ONLY while no other workflow in this repo runs on pull
# requests (owner, 2026-10-04). This repo had no CI workflow at all, so an
# empty check list was the steady state and blocking on it would leave every
# PR permanently unmergeable. The guard now reads the repo's active workflows
# once per sweep: the moment one of them runs on pull_request, an empty list
# means "CI has not reported yet" and blocks, like dev-hub/wiselead-marketing/
# academy-programs. An unreadable workflow list counts as "CI expected". When
# CI is added here, also list it under `on.workflow_run.workflows` so its
# completion re-runs this guard.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    # Every change to the PR re-audits it (owner, 2026-10-04): commits, title/body edits,
    # draft state, assignees, review requests, and the `guardian:skip` label. labeled/unlabeled
    # are listened to only for `guardian:skip`: the job's `if:` drops every other label event,
    # because the guard writes its own labels (`guardian:blocked` and others).
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, assigned, unassigned, review_requested, review_request_removed, labeled, unlabeled]
  # A review submitted or dismissed changes what the guard sees too.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  issues: write        # gh label create
  pull-requests: write
  checks: read
  actions: read

jobs:
  guard:
    name: Audit open PRs
    # Self-loop guards (owner, 2026-10-04). A review by a bot (Copilot's review, or the
    # guardian's own `gh pr review` verdict should it ever run under a token that triggers
    # workflows) must not fan out another sweep. `labeled`/`unlabeled` are triggers only so
    # that adding or removing `guardian:skip` re-audits at once; any other label event is
    # dropped here, because the guard writes its own labels (`guardian:blocked` and others).
    if: >-
      (github.event_name != 'pull_request_review' || github.event.review.user.type != 'Bot')
      && (github.event_name != 'pull_request'
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'guardian:skip')
    # ONE repository-wide group (owner, 2026-10-04). Every run sweeps EVERY open PR, so a
    # per-PR or per-branch key let events on two different PRs start two overlapping sweeps
    # that raced on the same reviews, labels and merges. With one group and no
    # cancel-in-progress, GitHub keeps the sweep already running plus ONE pending run and
    # drops superseded pending ones; each run re-reads the whole open-PR set, so a dropped
    # one cannot skip a PR. A dropped `pull_request` run shows as a cancelled check on its PR;
    # the CI gate below excludes every run of this workflow, so it never blocks the PR.
    # Job-level rather than workflow-level so a run the `if:` above skips never enters the
    # group and never displaces a real pending sweep.
    concurrency:
      group: pr-guardian-${{ github.repository }}
      cancel-in-progress: false
    runs-on: [self-hosted, linux]
    steps:
      - name: Audit all open PRs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY

          gh label create 'guardian:blocked' --repo $repo --color 'b60205' --description 'PR Guardian: not ready to merge' --force
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not ensure guardian:blocked exists" }
          gh label create 'guardian:skip' --repo $repo --color 'ededed' --description 'PR Guardian: skip this PR entirely' --force
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not ensure guardian:skip exists" }

          # The canonical org five. See AGENTS.md.
          $requiredSections = @(
            'Executive Summary',
            'Technical Summary',
            'Testing',
            'Risk & Rollout',
            'Reviewer Guidance'
          )

          function Test-GuardianVerdictChanged([int]$PrNumber, [string]$Verdict) {
            $encodedBodies = gh api --paginate "repos/$repo/pulls/$PrNumber/reviews?per_page=100" `
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("PR Guardian")) | .body | @base64' 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Could not read prior Guardian reviews for PR #$PrNumber" }
            $lastEncoded = @($encodedBodies | Where-Object { $_ } | Select-Object -Last 1)
            if ($lastEncoded.Count -eq 0) { return $true }
            $lastVerdict = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($lastEncoded[0]))
            return $lastVerdict -cne $Verdict
          }
          # Exactly one space between keyword and target.
          $issueLink = '(?m)\b(Closes|Fixes|Resolves|Part of) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|#)\d+\b'

          # Read ONCE per run, before the loop (ai-org#207 W2). The default branch
          # decides the merge method and the base-branch rule below.
          $defaultBranch = gh repo view $repo --json defaultBranchRef --jq .defaultBranchRef.name
          if ($LASTEXITCODE -ne 0 -or -not $defaultBranch) { throw "could not read the default branch of $repo" }

          # Base-branch rule: in a repo with a develop branch, only develop, release/*
          # and hotfix/* may target the default branch (ai-org docs/WAYS-OF-WORKING.md).
          # A 404 means no develop, so the rule is off; any other failure is a guardian
          # malfunction and throws like the gh pr list failure below.
          $developOut = gh api "repos/$repo/branches/develop" 2>&1
          if ($LASTEXITCODE -eq 0) {
            $hasDevelop = $true
            Write-Host "Base-branch rule on: $repo has develop; only develop, release/* and hotfix/* may target $defaultBranch"
          } elseif (($developOut | Out-String) -match 'HTTP 404') {
            $hasDevelop = $false
            Write-Host "Base-branch rule skipped: $repo has no develop branch"
          } else {
            throw "could not check whether $repo has a develop branch: $($developOut | Out-String)"
          }
          $global:LASTEXITCODE = 0

          # Records a blocked verdict on ONE PR: a COMMENT review plus the
          # guardian:blocked label. Shared by the audit and the merge call, so a PR
          # found to conflict only at merge time is told so on its own thread in the
          # same shape as any other block.
          function Set-GuardianBlocked([int]$PrNumber, [string[]]$Reasons) {
            $comment = "**PR Guardian - blocked**`n`nThis PR is not ready to merge until the following are resolved:`n" `
              + ($Reasons -join "`n") `
              + "`n`nPush a fix, or edit the PR body, and the guardian re-evaluates automatically (every 15 minutes, or on the next PR event)."
            if (Test-GuardianVerdictChanged $PrNumber $comment) {
              gh pr review $PrNumber --repo $repo --comment --body $comment
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not post review on #$PrNumber" }
            } else { Write-Host "PR #$PrNumber verdict unchanged; not posting a duplicate review" }
            # REST, not `gh pr edit`: that queries the retired Projects Classic
            # GraphQL field on the fleet's gh version and fails.
            gh api --method POST "repos/$repo/issues/$PrNumber/labels" -f 'labels[]=guardian:blocked' | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not label #$PrNumber" }
          }

          # Does any OTHER active workflow in this repo run on pull requests? Read once per
          # sweep (see header). Anything unreadable counts as "CI expected", which blocks an
          # empty check list rather than merging through it.
          $prCiExpected = $false
          try {
            $wfPaths = @(gh api "repos/$repo/actions/workflows?per_page=100" --jq '.workflows[] | select(.state == "active") | .path')
            if ($LASTEXITCODE -ne 0) { throw 'could not list workflows' }
            foreach ($p in $wfPaths) {
              if (-not $p -or $p -notmatch '^\.github/workflows/' -or $p -match '/pr-guardian\.ya?ml$') { continue }
              $src = (gh api "repos/$repo/contents/$p" -H 'Accept: application/vnd.github.raw' 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) {
                # A workflow whose file was deleted stays registered as `active`; skip it.
                if ($src -match 'HTTP 404') { continue }
                throw "could not read $p"
              }
              if ($src -match '(?m)^[^#\n]*\bpull_request(_target)?\b') { $prCiExpected = $true }
            }
          } catch {
            Write-Host "::warning::$_ - treating PR CI as expected (an empty check list blocks)"
            $prCiExpected = $true
          }
          $global:LASTEXITCODE = 0
          Write-Host "PR CI expected in ${repo}: $prCiExpected"

          $prsJson = gh pr list --repo $repo --state open --limit 100 --json number,title,body,isDraft,assignees,labels,headRefName,baseRefName
          if ($LASTEXITCODE -ne 0) { throw "gh pr list failed" }
          $prs = @($prsJson | ConvertFrom-Json)
          Write-Host "Auditing $($prs.Count) open PR(s) in $repo"

          foreach ($pr in $prs) {
            $num = $pr.number
            $body = if ($pr.body) { $pr.body } else { '' }
            $labels = @($pr.labels | ForEach-Object { $_.name })
            Write-Host "--- PR #$num : $($pr.title)"

            if ($labels -icontains 'guardian:skip') {
              Write-Host "PR #$num skipped (guardian:skip)"
              continue
            }

            $isDependabot = $pr.headRefName -like 'dependabot/*'
            $blockReasons = @()

            if ($pr.isDraft) { $blockReasons += '- PR is still a draft' }

            if (-not $isDependabot) {
              if ($pr.assignees.Count -eq 0) { $blockReasons += '- No assignee set' }
              foreach ($section in $requiredSections) {
                if ($body -notmatch [regex]::Escape($section)) {
                  $blockReasons += "- Missing PR body section: $section"
                }
              }
              if ($body -notmatch $issueLink) {
                $blockReasons += '- No issue link. Use `Closes #N`, `Fixes #N`, `Resolves #N` or `Part of #N`.'
              }
            }

            # CI state via statusCheckRollup, not `gh pr checks` text output -
            # see header. Fails closed (owner, 2026-10-04): only checks that have
            # COMPLETED as success/neutral/skipped pass; anything queued, in
            # progress, pending, failed or unreadable blocks. Excludes every run of
            # this workflow (by workflow name), or the guardian blocks on itself
            # forever.
            $rollupJson = gh pr view $num --repo $repo --json 'statusCheckRollup,headRefOid'
            # The commit this CI verdict belongs to, read in the SAME call: the merge is bound to it.
            $auditedHead = ''
            if ($LASTEXITCODE -eq 0 -and $rollupJson) { try { $auditedHead = "$(($rollupJson | ConvertFrom-Json).headRefOid)" } catch { $auditedHead = '' } }
            $ciReadOk = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0

            $checks = @()
            if ($ciReadOk) {
              try {
                $allChecks = @(($rollupJson | ConvertFrom-Json).statusCheckRollup)
                $checks = @($allChecks | Where-Object { $_.workflowName -ne $env:GITHUB_WORKFLOW })
              } catch { $ciReadOk = $false }
            }

            if (-not $ciReadOk) {
              $blockReasons += '- Could not read CI status (treating as not green)'
            } elseif ($checks.Count -gt 0) {
              $failed = @()
              $pending = @()
              foreach ($check in $checks) {
                $name = if ($check.name) { $check.name } else { $check.context }
                if ($check.__typename -ceq 'CheckRun') {
                  if ($check.status -ne 'COMPLETED') { $pending += $name; continue }
                  if ($check.conclusion -notin @('SUCCESS', 'NEUTRAL', 'SKIPPED')) { $failed += $name }
                } else {
                  if ($check.state -eq 'PENDING') { $pending += $name; continue }
                  if ($check.state -ne 'SUCCESS') { $failed += $name }
                }
              }
              if ($failed.Count -gt 0) { $blockReasons += "- CI is failing: $($failed -join ', ')" }
              if ($pending.Count -gt 0) { $blockReasons += "- CI is still running: $($pending -join ', ')" }
            } elseif ($prCiExpected) {
              $blockReasons += '- No CI checks have reported yet'
            }
            # $checks.Count -eq 0 passes only while no PR workflow exists - see header.

            # Mergeability per PR, read separately so a failed read only costs this
            # PR its conflict check. GitHub computes it lazily: UNKNOWN means "not
            # computed yet" and must never read as a conflict.
            $base = $pr.baseRefName
            $mergeable = 'UNKNOWN'
            $mergeableOut = gh pr view $num --repo $repo --json mergeable --jq .mergeable 2>&1
            if ($LASTEXITCODE -eq 0 -and $mergeableOut) {
              $mergeable = ($mergeableOut | Out-String).Trim()
            } else {
              Write-Host "PR #${num}: could not read mergeable state, auditing without it"
              Write-Host ($mergeableOut | Out-String)
            }
            $global:LASTEXITCODE = 0
            Write-Host "PR #$num mergeable = $mergeable (base $base)"

            # Same text wherever a conflict is detected, so the verdict does not flap.
            $conflictReason = "- Branch conflicts with $base and cannot be merged (rebase onto $base, or merge it in, and push)"
            if ($mergeable -eq 'CONFLICTING') { $blockReasons += $conflictReason }

            $headRef = $pr.headRefName
            if ($hasDevelop -and $base -eq $defaultBranch -and
                -not ($headRef -eq 'develop' -or $headRef -like 'release/*' -or $headRef -like 'hotfix/*')) {
              $blockReasons += "- Base branch is $defaultBranch but head is ${headRef}: only develop, release/* and hotfix/* may target $defaultBranch (retarget this PR to develop)"
            }

            if ($blockReasons.Count -gt 0) {
              Write-Host "PR #$num BLOCKED"
              Set-GuardianBlocked $num $blockReasons
            } else {
              Write-Host "PR #$num PASSED"
              $comment = "**PR Guardian - all checks passed.** Not a draft, assignee set, all five body sections present, issue linked. Merging now."
              if (Test-GuardianVerdictChanged $num $comment) {
                gh pr review $num --repo $repo --comment --body $comment
                if ($LASTEXITCODE -ne 0) { Write-Host "::warning::could not post review on #$num" }
              } else { Write-Host "PR #$num verdict unchanged; not posting a duplicate review" }
              # REST, not `gh pr edit` - see Set-GuardianBlocked. 404 = label not on the PR.
              $unlabelOut = gh api --method DELETE "repos/$repo/issues/$num/labels/guardian%3Ablocked" 2>&1
              if ($LASTEXITCODE -ne 0) {
                if (($unlabelOut | Out-String) -match 'HTTP 404') { Write-Host "removing guardian:blocked from #$num was a no-op" }
                else { Write-Host "::warning::could not clear guardian:blocked on #$num" }
              }

              # Merge method keys off the BASE branch. Decided 2026-09-24 (ai-org
              # docs/WAYS-OF-WORKING.md): base-keyed; head-keying squashed release/* and
              # hotfix/* into main. Into the default branch -> --merge; anything else
              # (feature/* into develop) -> --squash.
              $mergeMethod = if ($base -eq $defaultBranch) { '--merge' } else { '--squash' }
              # Never delete a long-lived branch: with base-keyed merges a develop -> main PR
              # would otherwise delete develop. Only feature-style heads are deleted (ai-org#207 W2).
              $deleteArgs = @(if ("$($pr.headRefName)" -notmatch '^(develop|main)$|^(release|hotfix)/') { '--delete-branch' })
              # HEAD-BOUND MERGE (2026-10-05). The audit read the PR list, then CI, then
              # mergeability; a push, a draft flip or a guardian:skip label added meanwhile would
              # otherwise only be seen by the NEXT run. Re-read those gates (head commit, state,
              # draft, guardian:skip) right before merging, and bind the merge to the audited commit
              # with --match-head-commit so GitHub itself refuses it if the head moves after this
              # read. A skipped merge is never a failure: the next run re-audits the PR from scratch.
              $nowJson = gh pr view $num --repo $repo --json 'headRefOid,isDraft,state,labels' 2>$null
              $nowOk = ($LASTEXITCODE -eq 0)
              $global:LASTEXITCODE = 0
              $now = $null
              if ($nowOk -and $nowJson) { try { $now = $nowJson | ConvertFrom-Json } catch { $now = $null } }
              if (-not $auditedHead -or -not $now) {
                Write-Host "PR #$num not merged: could not read its audited head or re-read it before merging; the next run re-audits it"
                continue
              }
              $nowSkip = @($now.labels | ForEach-Object { $_.name }) -icontains 'guardian:skip'
              if ($now.state -cne 'OPEN' -or $now.isDraft -or "$($now.headRefOid)" -cne $auditedHead -or $nowSkip) {
                Write-Host "PR #$num not merged: it changed during this audit (head $auditedHead -> $($now.headRefOid), state $($now.state), draft $($now.isDraft), guardian:skip $nowSkip); the next run re-audits it"
                continue
              }
              $mergeOut = gh pr merge $num --repo $repo $mergeMethod @deleteArgs --match-head-commit $auditedHead 2>&1
              $mergeExit = $LASTEXITCODE
              if ($mergeExit -eq 0) {
                Write-Host "PR #$num merged ($mergeMethod)"
              } elseif (($mergeOut | Out-String) -match 'not mergeable|merge commit cannot be cleanly created|[Mm]erge conflict') {
                # A conflict is the PR's own state, not a guardian fault: record the
                # blocked verdict on that PR (covers a conflict that appeared after the
                # mergeable read above, or an UNKNOWN read) and carry on.
                Write-Host "PR #$num conflicts with $base - recording it on the PR"
                Write-Host ($mergeOut | Out-String)
                Set-GuardianBlocked $num @($conflictReason)
              } else {
                Write-Host "::warning::could not merge #$num (gh exited $mergeExit) - may be already merged, or blocked by GitHub"
                Write-Host ($mergeOut | Out-String)
              }
            }
          }

          Write-Host "Audit complete."

          # THIS JOB ALWAYS SUCCEEDS, DELIBERATELY - see dev-hub's pr-guardian.yml
          # for the full writeup of why a red audit check becomes a permanent
          # self-inflicted block.
          exit 0
