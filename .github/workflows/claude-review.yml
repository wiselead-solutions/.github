# Claude PR review. Logic lives in the shared workflow in wiselead-solutions/wiselead-solutions.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: wiselead-solutions/wiselead-solutions/.github/workflows/claude-review.yml@main
    secrets: inherit
