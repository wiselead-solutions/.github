name: Request Staff Reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to update
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  request-staff-reviewer:
    name: Request staff reviewer
    runs-on: ubuntu-latest
    steps:
      - name: Request do-wiselead-solutions review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER: do-wiselead-solutions
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "::error title=Missing pull request::No pull request number was provided."
            exit 1
          fi

          if [ "$PR_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is a draft; reviewer will be requested when it is marked ready."
            exit 0
          fi

          if [ "$PR_AUTHOR" = "$REVIEWER" ]; then
            echo "PR #$PR_NUMBER was opened by $REVIEWER; not requesting author as reviewer."
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$REVIEWER"
